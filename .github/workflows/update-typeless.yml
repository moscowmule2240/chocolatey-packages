name: Update typeless

# Updates the typeless package. The job is in _update-package.yml.

on:
  workflow_dispatch: {}        # manual run
  # */5 is GitHub's minimum cron interval (every 5 min); scheduled runs are
  # best-effort and may be delayed under load. A run only pushes when upstream
  # has a version newer than the nuspec.
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes

permissions:
  contents: write              # the job commits the version bump back

concurrency:
  group: update-typeless
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/_update-package.yml
    with:
      package: typeless
    secrets:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
