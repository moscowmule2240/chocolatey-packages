name: Update package (reusable)

# The update job shared by every package. Each package's workflow
# (update-<id>.yml) calls this with its directory, and sets the schedule, the
# concurrency group, `contents: write` and CHOCO_API_KEY. The job detects a
# new upstream release with the package's update.ps1, repacks and
# test-installs it, publishes it to the Chocolatey community feed, and commits
# the version bump back to the repository. A dry run stops before the push: it
# runs everything through the test install and the Chocolatey status check, and
# neither pushes the package nor commits.

on:
  workflow_call:
    inputs:
      package:
        description: Package directory, which is also the package id.
        required: true
        type: string
      dry-run:
        description: Build, validate and test-install, but do not push or commit.
        required: false
        type: boolean
        default: false
    secrets:
      CHOCO_API_KEY:
        required: true

jobs:
  update:
    runs-on: windows-latest
    defaults:
      run:
        # Matches the built-in pwsh shell (same .ps1 wrapper,
        # $ErrorActionPreference = 'stop' and $LASTEXITCODE tail) while adding
        # -NoProfile so runner or user profiles are never loaded during steps.
        shell: pwsh -NoProfile -Command ". '{0}'"
    env:
      PKG_DIR: ${{ inputs.package }}
      AU_VERSION: '2022.10.24'
      # SHA-256 of the ordinal-sorted "<sha256>  <relative-path>\n" manifest of
      # AU 2022.10.24's 33 module files (excluding root PSGetModuleInfo.xml).
      AU_TREE_SHA256: '1561c9c0f28f08f63f7d5eb9c286bf8abca5bbcfdef0155ae7064f3d0793b4b3'
    steps:
      - name: Checkout
        uses: actions/checkout@v6   # current major; Node 24 (v4 ran on the deprecated Node 20)
        with:
          fetch-depth: 0

      # Checks what a calling workflow has to supply, on every run: the
      # publishing key and write access for the version-bump commit. Both are
      # otherwise used only when AU builds a new version, so a caller that left
      # either out would stay green until the next upstream release.
      - name: Preflight
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Error "CHOCO_API_KEY is empty. Either the repository secret is not set (Settings > Secrets and variables > Actions), or the calling workflow does not pass it under 'secrets:'."
            exit 1
          }
          # Write-access probe. An HTTPS push requests the remote's receive-pack
          # advertisement first, which GitHub serves only with write access;
          # --dry-run then evaluates the ref update without sending any data.
          # The destination is a branch name that is never created, so the
          # result cannot depend on whether the checked-out ref is behind the
          # remote (non-fast-forward) or detached (a dispatch on a tag).
          git push --dry-run origin HEAD:refs/heads/preflight-write-probe
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git push --dry-run failed. The usual cause is a calling workflow without 'permissions: contents: write'; see the git output above for the exact reason."
            exit 1
          }

      # AU has not released since 2022.10.24, while PSGallery intermittently
      # returns HTTP 403/404 to shared GitHub-hosted runners. Restore before
      # installing and save right after verification (before choco install or
      # test-install runs third-party installers) so later steps in this job
      # cannot modify the cached directory before save or discard a good
      # install on failure.
      - name: Resolve AU module path
        id: au-path
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          if (-not $docs) {
            Write-Error "Could not resolve MyDocuments folder for CurrentUser PowerShell modules."
            exit 1
          }
          $dir = [System.IO.Path]::Combine($docs, 'PowerShell', 'Modules', 'AU', $env:AU_VERSION)
          "dir=$dir" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Restore AU module cache
        id: au-cache
        uses: actions/cache/restore@v6   # current major; Node 24
        with:
          path: ${{ steps.au-path.outputs.dir }}
          key: au-v1-${{ runner.os }}-${{ env.AU_VERSION }}-${{ env.AU_TREE_SHA256 }}

      - name: Install AU module
        env:
          AU_CACHE_HIT: ${{ steps.au-cache.outputs.cache-hit }}
          AU_MODULE_DIR: ${{ steps.au-path.outputs.dir }}
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          # PSResourceGet (ships in pwsh 7.4+) installs from PSGallery without
          # the legacy PackageManagement NuGet provider bootstrap. Verify the
          # pinned AU directory tree by SHA-256 before importing so a corrupted
          # cache or mismatched download is caught before AU is imported.
          # 'AU' is the Chocolatey Automatic Updater (provides Import-Module AU).
          $auDir = $env:AU_MODULE_DIR
          if (-not $auDir) {
            Write-Error "AU_MODULE_DIR is empty."
            exit 1
          }

          function Test-AUModule([string]$Dir) {
            try {
              if (-not (Test-Path -LiteralPath $Dir -PathType Container)) { return $false }
              $root = [System.IO.Path]::TrimEndingDirectorySeparator((Resolve-Path -LiteralPath $Dir).Path)
              $entries = [System.Collections.Generic.List[string]]::new()
              foreach ($file in (Get-ChildItem -LiteralPath $root -Recurse -File -Force)) {
                $rel = [System.IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
                if ($rel -eq 'PSGetModuleInfo.xml') { continue }
                $sha = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $entries.Add("$sha  $rel")
              }
              if ($entries.Count -eq 0) { return $false }
              $sorted = $entries.ToArray()
              [System.Array]::Sort($sorted, [System.StringComparer]::Ordinal)
              $manifest = ($sorted -join "`n") + "`n"
              $actual = [System.Convert]::ToHexString(
                [System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($manifest))
              ).ToLowerInvariant()
              if ($actual -ne $env:AU_TREE_SHA256) {
                Write-Host "::warning::AU $env:AU_VERSION tree hash mismatch: expected $env:AU_TREE_SHA256, got $actual ($($sorted.Length) files)."
                return $false
              }
              $env:AU_VERIFIED_DIR = $root
              & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '$avail = @(Get-Module -Name AU -ListAvailable); if ($avail.Count -ne 1) { throw "Expected exactly one available AU module, found $($avail.Count): $($avail.ModuleBase -join '', '')" }; $m = Import-Module -Name AU -RequiredVersion $env:AU_VERSION -PassThru -ErrorAction Stop; if ([System.IO.Path]::TrimEndingDirectorySeparator((Resolve-Path -LiteralPath $m.ModuleBase).Path) -ne $env:AU_VERIFIED_DIR) { throw "Loaded AU from unexpected path: $($m.ModuleBase)" }' | Out-Host
              return ($LASTEXITCODE -eq 0)
            } catch {
              Write-Host "::warning::AU $env:AU_VERSION verification failed: $($_.Exception.Message)"
              return $false
            }
          }

          if (Test-AUModule -Dir $auDir) {
            if ($env:AU_CACHE_HIT -eq 'true') {
              Write-Host "AU $env:AU_VERSION restored from cache and verified."
            } else {
              Write-Host "AU $env:AU_VERSION already installed and verified."
            }
          } else {
            if ($env:AU_CACHE_HIT -eq 'true') {
              Write-Host "::warning::Cache hit for AU $env:AU_VERSION failed verification; reinstalling from PSGallery."
            }
            $delays   = @(5, 15, 30)
            $attempts = $delays.Count + 1
            for ($i = 0; $i -lt $attempts; $i++) {
              if ($i -gt 0) {
                $delay = $delays[$i - 1]
                Write-Host "Retrying AU $env:AU_VERSION install in ${delay}s [$($i + 1)/$attempts]"
                Start-Sleep -Seconds $delay
              }
              try {
                if (Test-Path -LiteralPath $auDir) {
                  Remove-Item -LiteralPath $auDir -Recurse -Force
                }
                Install-PSResource -Name AU -Version "[$($env:AU_VERSION)]" -Repository PSGallery -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
              } catch {
                if ($i -eq $attempts - 1) { throw }
                Write-Host "Install-PSResource attempt $($i + 1)/$attempts failed: $($_.Exception.Message)"
                continue
              }
              if (-not (Test-AUModule -Dir $auDir)) {
                Write-Host "::error::AU $env:AU_VERSION failed verification after Install-PSResource completed."
                exit 1
              }
              break
            }
          }

      - name: Save AU module cache
        # Skip saving when restore returned early without setting
        # cache-primary-key (e.g. cache backend unavailable), since save@v6
        # marks key as required.
        if: steps.au-cache.outputs.cache-hit != 'true' && steps.au-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v6      # current major; Node 24
        with:
          path: ${{ steps.au-path.outputs.dir }}
          key: ${{ steps.au-cache.outputs.cache-primary-key }}

      - name: Install Chocolatey tools (checksum + validation)
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          choco install checksum -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Runs the community repository's nuspec rules (CPMR*) inside
          # 'choco pack', which AU calls - so a nuspec that the push endpoint
          # would refuse (e.g. CPMR0026, description over 4000 characters)
          # fails the build here instead of surfacing as a bare 409 Conflict
          # from push.chocolatey.org.
          choco install chocolatey-community-validation.extension -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Validates the nuspec as committed, on every run - including the runs
      # where AU finds nothing new and never packs. The package is built into a
      # scratch directory so that 'Detect built package' below does not mistake
      # it for an AU build and try to publish the current version. Rule output
      # is repeated as GitHub error annotations so it shows at the top of the
      # run summary.
      - name: Validate nuspec against community repository rules
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'nuspec-validation'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Push-Location $env:PKG_DIR
          # Capture stdout only: choco writes the rule results there. stderr is
          # left uncaptured and still reaches the step log. Merging it with 2>&1
          # would also be safe: since pwsh 7.2, $ErrorActionPreference does not
          # apply to redirected native-command stderr.
          & choco pack --outputdirectory $out | Tee-Object -Variable log
          $code = $LASTEXITCODE
          Pop-Location
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            $log | Where-Object { "$_" -match 'CPMR\d{4}' } |
              ForEach-Object { Write-Host "::error::$("$_".Trim())" }
            Write-Error "nuspec failed community validation (choco pack exit $code) - see the rule output above"
            exit 1
          }

      - name: Run AU update (detect + repack if newer)
        env:
          # The unauthenticated GitHub API limit is 60 requests/hour metered per
          # IP address, which shared runners exhaust; the Actions token raises it
          # to 1,000/hour for this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '& "./$env:PKG_DIR/update.ps1"'

      - name: Detect built package
        id: pkg
        run: |
          $nupkg = Get-ChildItem -Path "$env:PKG_DIR/*.nupkg" -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nupkg) {
            Write-Host "No .nupkg produced - already at the latest version. Nothing to do."
            "found=false" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $nuspec = Get-ChildItem -Path "$env:PKG_DIR/*.nuspec" | Select-Object -First 1
          [xml]$ns = Get-Content $nuspec.FullName
          "found=true"                              | Out-File $env:GITHUB_OUTPUT -Append
          "id=$($ns.package.metadata.id)"           | Out-File $env:GITHUB_OUTPUT -Append
          "version=$($ns.package.metadata.version)" | Out-File $env:GITHUB_OUTPUT -Append
          "nupkg=$($nupkg.FullName)"                | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Built $($ns.package.metadata.id) v$($ns.package.metadata.version)"

      # Step outputs are passed through env: (not interpolated into the shell
      # body) so nothing is ever expanded straight into a run: command.
      - name: Test install / uninstall
        if: steps.pkg.outputs.found == 'true'
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          $src = (Resolve-Path $env:PKG_DIR).Path
          choco install $env:PKG_ID --version $env:PKG_VERSION -y --no-progress --source "$src"
          if ($LASTEXITCODE -ne 0) { Write-Error "Install test failed"; exit 1 }
          choco uninstall $env:PKG_ID -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Error "Uninstall test failed"; exit 1 }

      - name: Check Chocolatey status
        if: steps.pkg.outputs.found == 'true'
        id: status
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          $s = ./scripts/Check-ChocolateyStatus.ps1 -PackageId $env:PKG_ID -PackageVersion $env:PKG_VERSION
          Write-Host "Status: $s"
          "status=$s" | Out-File $env:GITHUB_OUTPUT -Append

      # A dry run says what it did: without the warning, a run with no newer
      # upstream version is green although nothing was built or test-installed.
      - name: Dry run summary
        if: inputs.dry-run
        env:
          PKG_FOUND: ${{ steps.pkg.outputs.found }}
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          PKG_STATUS: ${{ steps.status.outputs.status }}
        run: |
          if ($env:PKG_FOUND -eq 'true') {
            Write-Host "::notice::Dry run - built and test-installed $env:PKG_ID $env:PKG_VERSION (status $env:PKG_STATUS); not pushed, not committed."
          } else {
            Write-Host "::warning::Dry run - upstream has no version newer than the nuspec, so nothing was built or test-installed."
          }

      # In a dry run the step is skipped, and the key is withheld as well, so a
      # mistake in the condition fails the push instead of publishing.
      - name: Push to Chocolatey
        if: ${{ !inputs.dry-run && steps.pkg.outputs.found == 'true' && steps.status.outputs.status == 'PROCEED_WITH_PUSH' }}
        id: push
        env:
          CHOCO_API_KEY: ${{ !inputs.dry-run && secrets.CHOCO_API_KEY || '' }}
          NUPKG_PATH: ${{ steps.pkg.outputs.nupkg }}
        run: |
          # Preflight has already failed the run if CHOCO_API_KEY is empty;
          # here it is empty only in a dry run.
          if (-not $env:CHOCO_API_KEY) { Write-Error "No API key for the push (dry run)"; exit 1 }
          choco push "$env:NUPKG_PATH" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { Write-Error "choco push failed"; exit 1 }
          "pushed=true" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Record successful push
        if: steps.push.outputs.pushed == 'true'
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path logs -Force | Out-Null
          Add-Content -Path logs/pushed-versions.log -Value "$env:PKG_ID/$env:PKG_VERSION"

      # Only commit the bump once it is published (or already on the feed), so a
      # version whose push failed is retried on the next run instead of being
      # silently left behind.
      - name: Commit version bump
        if: ${{ !inputs.dry-run && steps.pkg.outputs.found == 'true' && (steps.push.outputs.pushed == 'true' || steps.status.outputs.status == 'SKIP_PUSH') }}
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$env:PKG_DIR" logs
          # PowerShell's if tests a command's output, not its exit code, so the
          # exit code is read explicitly: 0 = nothing staged, 1 = changes.
          git diff --staged --quiet
          $diff = $LASTEXITCODE
          if ($diff -eq 0) {
            Write-Host "No source changes to commit."
          } elseif ($diff -eq 1) {
            # Without this check a failed commit is masked: the push that follows
            # finds nothing new, exits 0, and the step reports success.
            git commit -m "Auto-update $env:PKG_ID to $env:PKG_VERSION [skip ci]"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "git commit failed (exit $LASTEXITCODE)"
              exit 1
            }
            git push
          } else {
            Write-Error "git diff --staged failed (exit $diff)"
            exit 1
          }
