name: Update package (reusable)

# The update job shared by every package. Each package's workflow
# (update-<id>.yml) calls this with its directory, and sets the schedule, the
# concurrency group, `contents: write` and CHOCO_API_KEY. The job detects a
# new upstream release with the package's update.ps1, repacks and
# test-installs it, publishes it to the Chocolatey community feed, and commits
# the version bump back to the repository.

on:
  workflow_call:
    inputs:
      package:
        description: Package directory, which is also the package id.
        required: true
        type: string
    secrets:
      CHOCO_API_KEY:
        required: true

jobs:
  update:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PKG_DIR: ${{ inputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6   # current major; Node 24 (v4 ran on the deprecated Node 20)
        with:
          fetch-depth: 0

      # Checks what a calling workflow has to supply, on every run: the
      # publishing key and write access for the version-bump commit. Both are
      # otherwise used only when AU builds a new version, so a caller that left
      # either out would stay green until the next upstream release.
      - name: Preflight
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Error "CHOCO_API_KEY is empty. Either the repository secret is not set (Settings > Secrets and variables > Actions), or the calling workflow does not pass it under 'secrets:'."
            exit 1
          }
          # Write-access probe. An HTTPS push requests the remote's receive-pack
          # advertisement first, which GitHub serves only with write access;
          # --dry-run then evaluates the ref update without sending any data.
          # The destination is a branch name that is never created, so the
          # result cannot depend on whether the checked-out ref is behind the
          # remote (non-fast-forward) or detached (a dispatch on a tag).
          git push --dry-run origin HEAD:refs/heads/preflight-write-probe
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git push --dry-run failed. The usual cause is a calling workflow without 'permissions: contents: write'; see the git output above for the exact reason."
            exit 1
          }

      - name: Install prerequisites (AU + checksum)
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          # PSResourceGet (ships in pwsh 7.4+) installs from PSGallery over NuGet v3
          # natively - no PackageManagement 'NuGet' provider bootstrap needed.
          # 'AU' is the Chocolatey Automatic Updater (provides Import-Module AU).
          Install-PSResource -Name AU -TrustRepository
          choco install checksum -y --no-progress
          # Runs the community repository's nuspec rules (CPMR*) inside
          # 'choco pack', which AU calls - so a nuspec that the push endpoint
          # would refuse (e.g. CPMR0026, description over 4000 characters)
          # fails the build here instead of surfacing as a bare 409 Conflict
          # from push.chocolatey.org.
          choco install chocolatey-community-validation.extension -y --no-progress

      # Validates the nuspec as committed, on every run - including the runs
      # where AU finds nothing new and never packs. The package is built into a
      # scratch directory so that 'Detect built package' below does not mistake
      # it for an AU build and try to publish the current version. Rule output
      # is repeated as GitHub error annotations so it shows at the top of the
      # run summary.
      - name: Validate nuspec against community repository rules
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'nuspec-validation'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Push-Location $env:PKG_DIR
          # Capture stdout only: choco writes the rule results there. stderr is
          # left uncaptured and still reaches the step log. Merging it with 2>&1
          # would also be safe: since pwsh 7.2, $ErrorActionPreference does not
          # apply to redirected native-command stderr.
          & choco pack --outputdirectory $out | Tee-Object -Variable log
          $code = $LASTEXITCODE
          Pop-Location
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            $log | Where-Object { "$_" -match 'CPMR\d{4}' } |
              ForEach-Object { Write-Host "::error::$("$_".Trim())" }
            Write-Error "nuspec failed community validation (choco pack exit $code) - see the rule output above"
            exit 1
          }

      - name: Run AU update (detect + repack if newer)
        env:
          # The unauthenticated GitHub API limit is 60 requests/hour metered per
          # IP address, which shared runners exhaust; the Actions token raises it
          # to 1,000/hour for this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '& "./$env:PKG_DIR/update.ps1"'

      - name: Detect built package
        id: pkg
        run: |
          $nupkg = Get-ChildItem -Path "$env:PKG_DIR/*.nupkg" -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nupkg) {
            Write-Host "No .nupkg produced - already at the latest version. Nothing to do."
            "found=false" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $nuspec = Get-ChildItem -Path "$env:PKG_DIR/*.nuspec" | Select-Object -First 1
          [xml]$ns = Get-Content $nuspec.FullName
          "found=true"                              | Out-File $env:GITHUB_OUTPUT -Append
          "id=$($ns.package.metadata.id)"           | Out-File $env:GITHUB_OUTPUT -Append
          "version=$($ns.package.metadata.version)" | Out-File $env:GITHUB_OUTPUT -Append
          "nupkg=$($nupkg.FullName)"                | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Built $($ns.package.metadata.id) v$($ns.package.metadata.version)"

      # Step outputs are passed through env: (not interpolated into the shell
      # body) so nothing is ever expanded straight into a run: command.
      - name: Test install / uninstall
        if: steps.pkg.outputs.found == 'true'
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          $src = (Resolve-Path $env:PKG_DIR).Path
          choco install $env:PKG_ID --version $env:PKG_VERSION -y --no-progress --source "$src"
          if ($LASTEXITCODE -ne 0) { Write-Error "Install test failed"; exit 1 }
          choco uninstall $env:PKG_ID -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Error "Uninstall test failed"; exit 1 }

      - name: Check Chocolatey status
        if: steps.pkg.outputs.found == 'true'
        id: status
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          $s = ./scripts/Check-ChocolateyStatus.ps1 -PackageId $env:PKG_ID -PackageVersion $env:PKG_VERSION
          Write-Host "Status: $s"
          "status=$s" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Push to Chocolatey
        if: steps.pkg.outputs.found == 'true' && steps.status.outputs.status == 'PROCEED_WITH_PUSH'
        id: push
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          NUPKG_PATH: ${{ steps.pkg.outputs.nupkg }}
        run: |
          # Preflight has already failed the run if CHOCO_API_KEY is empty.
          choco push "$env:NUPKG_PATH" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { Write-Error "choco push failed"; exit 1 }
          "pushed=true" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Record successful push
        if: steps.push.outputs.pushed == 'true'
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path logs -Force | Out-Null
          Add-Content -Path logs/pushed-versions.log -Value "$env:PKG_ID/$env:PKG_VERSION"

      # Only commit the bump once it is published (or already on the feed), so a
      # version whose push failed is retried on the next run instead of being
      # silently left behind.
      - name: Commit version bump
        if: steps.pkg.outputs.found == 'true' && (steps.push.outputs.pushed == 'true' || steps.status.outputs.status == 'SKIP_PUSH')
        env:
          PKG_ID: ${{ steps.pkg.outputs.id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$env:PKG_DIR" logs
          # PowerShell's if tests a command's output, not its exit code, so the
          # exit code is read explicitly: 0 = nothing staged, 1 = changes.
          git diff --staged --quiet
          $diff = $LASTEXITCODE
          if ($diff -eq 0) {
            Write-Host "No source changes to commit."
          } elseif ($diff -eq 1) {
            git commit -m "Auto-update $env:PKG_ID to $env:PKG_VERSION [skip ci]"
            git push
          } else {
            Write-Error "git diff --staged failed (exit $diff)"
            exit 1
          }
